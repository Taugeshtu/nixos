# Hydrogen

spacing         = 2
padding         = 0
# hide_ascii      = true
separator       = "➤"
key_color       = "#ff004f"
separator_color = "White"

[palette]
type = "Full"
visible = false

[bar]
glyph           = "ї"
symbol_open     = '〔'
symbol_close    = '〕'
# hide_delimiters = true
visible         = true

[box]
title = "XXX"
border          = "thick"
visible         = true

[box.inner_margin]
x               = 3
y               = 1

[custom_ascii]
color = "#ff004f"
path = "~/Media/ASCII/fetch_art.txt"

[randomize]
key_color       = false
separator_color = false

[keys]
host            = "who"
machine         = "model"
kernel          = "krnl"
distro          = "dstr"
wm              = "wm"
packages        = "packs"
shell           = "shell"
terminal        = "term"
backlight       = "lights"
battery         = "BATT"
os              = "os"
de              = "de"
uptime          = "uptime"
memory          = "MEM"
local_ip        = "ip"
resolution      = "res"
cpu_load        = "CPU_load"
cpu             = "CPU"
gpu             = "GPU"
disk_space      = "DSK_use"
