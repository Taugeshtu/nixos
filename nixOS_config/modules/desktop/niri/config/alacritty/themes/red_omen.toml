# fonting
[font]
size = 13.0

[font.normal]
family = "Mononoki"
[font.bold]
family = "Mononoki"
[font.italic]
family = "Mononoki"
[font.bold_italic]
family = "Mononoki"

# Colors
[colors.primary]
background = "#f9f9f9"
foreground = "#000000"

[colors.normal]
black = "#000000"
red = "#ff004f"
green = "#05996b"
yellow = "#bd852b"
blue = "#f53c3c"
magenta = "#b000b0"
cyan = "#2f7791"
white = "#ff004f"

[colors.bright]
black = "#3d3d3d"
red = "#f53c3c"
green = "#00FFB0"
yellow = "#ffb37b"
blue = "#7f052c"
magenta = "#b874b8"
cyan = "#49a1b3"
white = "#f83875"

[colors.cursor]
cursor = "#ff004f"
text = "#000000"

[colors.selection]
background = "#ff004f"
text = "#f9f9f9"

